<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css" >
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<nav>
    <a href="index.html">Home</a> |
    <a href="form.html">Register Now</a>
</nav>
<body>
    <h1>Student Registration Form </h1>
    <form action="thanks.html" method="get">

    <label for="name">Full Name: </label>
    <input type="text" id="name" name="Full name" placeholder="Enter your name">  <br><br>
    <label for="regno">Registration number: </label>
    <input type="text" id="regno" name="regno" required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>
    <label for="phone">Phone number:</label>
    <input type="tel" id="phone" name="Phone" placeholder="03XXXXXXXXX" >
    <br><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="Age" min="16" max="40"> <br><br>
    <label for="dob" >Date of birth:</label>
    <input type="dob" name="dob">
    <p>Gender:</p>
    <input type ="radio" name="gender" id="Male" vlaue="Male">
       <label for="male">Male</label>
    <input type ="radio" name="gender" id="Female" value="Female">
       <label for="female">Female</label>
    <br><br>
<p>Departement</p>
    <label for="department">Department:</label>
    <select id="department" name ="departement">
        <option value="AI"> AI</option>
        <option value SE>SE</option>
        <option value="CS">CS</option>
        <option value="EE">EE</option>
    </select>
    <p>Intersts</p>
     <label for="web">Web</label>
    <input type ="checkbox" id="web" name ="interests" value="Web">
    <label for="ai"> AI</label>
    <input type ="checkbox" id="AI" name ="interests" value="AI">
     <label for="games"> Games</label>
    <input type ="checkbox" id="Games" name ="interests" value="Games">
    <p>Address:</p>
    <textarea name="address" rows="4" ></textarea>
    <br><br>
    <button type="submit" >Register</button>
    <br><br>
    <button type="reset" >Clear</button>
    </form>  
</body>
</html>
